name: x86-linux

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main", "dev" ]

env:
  PACKAGE_DIR: ytdlp_webui_ubuntu_x86
  BUILD_TYPE: release

jobs:
  skip_check:
    continue-on-error: false
    runs-on: ubuntu-22.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
    - id: skip_check
      uses: fkirc/skip-duplicate-actions@v5
      with:
        concurrent_skipping: 'same_content'
        cancel_others: 'true'
        skip_after_successful_duplicate: 'true'
        paths_ignore: '["**/README.md", "**/docs/**", "**/LICENSE"]'
        do_not_skip: '["workflow_dispatch", "schedule"]'

  build:
    needs: skip_check
    if: needs.skip_check.outputs.should_skip != 'true'

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: npm install packages
      shell: bash
      working-directory: ./frontend
      run: npm install

    - name: npm lint
      shell: bash
      working-directory: ./frontend
      run: npm run lint

    - name: npm build
      shell: bash
      working-directory: ./frontend
      run: npm run build-only

    - name: rust Lint
      shell: bash
      run: cargo clippy --profile ${{env.BUILD_TYPE}} -- -D warnings

    - name: rust build
      shell: bash
      run: cargo build --profile ${{env.BUILD_TYPE}}

    - name: Copy files
      shell: bash
      run: |
        mkdir -p ${{env.PACKAGE_DIR}}
        cp ./target/${{env.BUILD_TYPE}}/server ${{env.PACKAGE_DIR}}/
        cp ./target/${{env.BUILD_TYPE}}/cli ${{env.PACKAGE_DIR}}/
        cp ./README.md ${{env.PACKAGE_DIR}}/
        cp ./LICENSE ${{env.PACKAGE_DIR}}/
        cp -rf ./static/ ${{env.PACKAGE_DIR}}/
        cp -rf ./scripts/ ${{env.PACKAGE_DIR}}/
        cp -rf ./docs/ ${{env.PACKAGE_DIR}}/

    - name: Upload files
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.PACKAGE_DIR}}
        path: ${{github.workspace}}/${{env.PACKAGE_DIR}}
